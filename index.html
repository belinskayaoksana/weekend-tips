<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Sun | Онлайн-студія ароматів</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --brand-bg:#fdfcfb;
      --brand-dark:#1a1a1a;
      --brand-gold:#d4af37;
    }
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--brand-bg);
      color: var(--brand-dark);
    }
    h1,h2,h3,.serif{ font-family:"Playfair Display", serif; }

    .fade-in{ animation: fadeIn .7s ease-out; }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(16px); }
      to{ opacity:1; transform: translateY(0); }
    }

    .slogan-accent{
      font-size: 1.25rem;
      line-height: 1.75rem;
      font-style: italic;
      font-weight: 300;
      color: #9ca3af; /* gray-400 */
    }
    @media (min-width: 768px){
      .slogan-accent{
        font-size: 1.5rem;
        line-height: 2rem;
      }
    }

    .btn-primary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#1a1a1a;
      color:#fff;
      padding:16px 40px;
      border-radius:9999px;
      transition: all .25s ease;
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.2em;
      user-select:none;
    }
    .btn-primary:hover{ background:#000; transform: translateY(-1px); }
    .btn-outline{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:1px solid #1a1a1a;
      color:#1a1a1a;
      padding:16px 40px;
      border-radius:9999px;
      transition: all .25s ease;
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.2em;
      user-select:none;
    }
    .btn-outline:hover{ background:#1a1a1a; color:#fff; transform: translateY(-1px); }

    .product-card:hover .product-media{ transform: scale(1.03) rotate(1deg); }
    .product-media{ transition: transform .45s ease; }

    .video-container{
      position:relative;
      padding-bottom:56.25%;
      height:0;
      overflow:hidden;
      border-radius: 2rem;
    }
    .video-container iframe,
    .video-container video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* Mobile drawer */
    .drawer-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      display:none;
      z-index: 60;
    }
    .drawer{
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(88vw, 380px);
      background: #fff;
      z-index: 70;
      transform: translateX(110%);
      transition: transform .25s ease;
      box-shadow: -20px 0 60px rgba(0,0,0,.12);
    }
    .drawer.open{ transform: translateX(0); }
    .drawer-backdrop.open{ display:block; }
  </style>
</head>

<body>
<div id="app">
  <!-- Header -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-stone-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="h-20 flex items-center justify-between">
        <button class="flex items-baseline gap-2 select-none" onclick="navigateTo('home')" aria-label="На головну">
          <span class="text-xl tracking-[0.28em] font-light uppercase">Your <span class="font-bold">Sun</span></span>
        </button>

        <!-- Desktop menu -->
        <div class="hidden md:flex items-center gap-10 text-[10px] font-bold uppercase tracking-[0.2em]">
          <button onclick="navigateTo('home')" class="hover:text-gray-400 transition-colors">Головна</button>

          <div class="relative group">
            <button class="hover:text-gray-400 transition-colors">
              Аромати <i class="fa-solid fa-chevron-down text-[8px] ml-1"></i>
            </button>
            <div class="absolute hidden group-hover:block w-56 bg-white shadow-2xl mt-4 py-3 border border-stone-50 rounded-xl overflow-hidden">
              <button onclick="navigateTo('self')" class="block px-5 py-2.5 hover:bg-stone-50 w-full text-left">Для себе</button>
              <button onclick="navigateTo('home-scents')" class="block px-5 py-2.5 hover:bg-stone-50 w-full text-left">Для дому</button>
            </div>
          </div>

          <button onclick="navigateTo('sets')" class="hover:text-gray-400 transition-colors">Сети</button>
          <button onclick="navigateTo('how-it-works')" class="hover:text-gray-400 transition-colors">Як це працює</button>
          <button onclick="navigateTo('about')" class="hover:text-gray-400 transition-colors">Про нас</button>
          <button onclick="navigateTo('faq')" class="hover:text-gray-400 transition-colors">FAQ</button>
          <button onclick="navigateTo('contacts')" class="hover:text-gray-400 transition-colors">Контакти</button>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-5">
          <button class="text-sm" aria-label="Пошук"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="text-sm relative" aria-label="Кошик">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="absolute -top-2 -right-2 bg-black text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
          </button>
          <button id="mobile-menu-button" class="md:hidden text-xl" onclick="openDrawer()" aria-label="Меню">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer" aria-label="Мобільне меню">
    <div class="p-6 border-b border-stone-100 flex items-center justify-between">
      <div class="text-base tracking-[0.25em] font-light uppercase">Your <span class="font-bold">Sun</span></div>
      <button class="text-xl" onclick="closeDrawer()" aria-label="Закрити"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="p-6 space-y-2 text-sm">
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('home'); closeDrawer()">Головна</button>

      <div class="pt-2 text-[10px] uppercase tracking-widest text-stone-400">Аромати</div>
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('self'); closeDrawer()">Для себе</button>
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('home-scents'); closeDrawer()">Для дому</button>

      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('sets'); closeDrawer()">Сети</button>
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('how-it-works'); closeDrawer()">Як це працює</button>
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('about'); closeDrawer()">Про нас</button>
      <button class="w-full text-left py-3 border-b border-stone-100" onclick="navigateTo('faq'); closeDrawer()">FAQ</button>
      <button class="w-full text-left py-3" onclick="navigateTo('contacts'); closeDrawer()">Контакти</button>
    </div>

    <div class="p-6 border-t border-stone-100 text-xs text-stone-400">
      Порада: після публікації відкрий сторінку через URL GitHub Pages.
    </div>
  </aside>

  <!-- Content -->
  <main id="content"></main>

  <!-- Footer -->
  <footer class="bg-white pt-20 pb-10 border-t border-stone-100">
    <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-4 gap-12 mb-14">
      <div>
        <div class="text-xl tracking-[0.3em] font-light uppercase">Your <span class="font-bold">Sun</span></div>
        <p class="mt-6 text-stone-400 text-sm leading-relaxed font-light italic">
          "Your Sun не каже: «Купи цей аромат» <br>Your Sun каже: «Давай знайдемо твій»"
        </p>
      </div>

      <div>
        <h4 class="text-[10px] font-bold uppercase tracking-widest mb-6">Службові сторінки</h4>
        <ul class="space-y-3 text-sm text-stone-500 font-light">
          <li><button onclick="navigateTo('delivery')" class="hover:text-black">Доставка та оплата</button></li>
          <li><button onclick="navigateTo('returns')" class="hover:text-black">Повернення та обмін</button></li>
          <li><button onclick="renderTextPage('Публічна оферта','Тут буде текст оферти (чернетка).');" class="hover:text-black">Публічна оферта</button></li>
          <li><button onclick="renderTextPage('Політика конфіденційності','Тут буде текст політики (чернетка).');" class="hover:text-black">Політика конфіденційності</button></li>
        </ul>
      </div>

      <div>
        <h4 class="text-[10px] font-bold uppercase tracking-widest mb-6">Студія</h4>
        <ul class="space-y-3 text-sm text-stone-500 font-light">
          <li><button onclick="navigateTo('about')" class="hover:text-black">Історія бренду</button></li>
          <li><button onclick="navigateTo('sets')" class="hover:text-black">Подарункові набори</button></li>
          <li><button onclick="navigateTo('contacts')" class="hover:text-black">Зв'язатися з нами</button></li>
        </ul>
      </div>

      <div>
        <h4 class="text-[10px] font-bold uppercase tracking-widest mb-6">Соціальні мережі</h4>
        <div class="flex gap-5">
          <a href="#" class="text-stone-400 hover:text-black transition-colors" aria-label="Instagram"><i class="fa-brands fa-instagram text-xl"></i></a>
          <a href="#" class="text-stone-400 hover:text-black transition-colors" aria-label="Telegram"><i class="fa-brands fa-telegram text-xl"></i></a>
          <a href="#" class="text-stone-400 hover:text-black transition-colors" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp text-xl"></i></a>
        </div>
      </div>
    </div>

    <div class="text-center text-[10px] uppercase tracking-widest text-stone-300">
      &copy; <span id="year"></span> Your Sun Studio. Made with love for your senses.
    </div>
  </footer>
</div>

<script>
  const content = document.getElementById('content');
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawerBackdrop');

  // Optional: add your local images in repo root and rename here if you want.
  // If a local image is missing, it will fallback to Unsplash automatically.
  const ASSETS = {
    hero: "./unnamed.jpg",            // якщо є в корені
    idea1: "./Gemini_Generated_Image.jpg", // можна замінити на реальну назву
    idea2: "./Gemini_Generated_Image_2.jpg"
  };

  function imgWithFallback(src, fallback) {
    const safeFallback = fallback || "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1400";
    return `
      <img src="${src}" alt="" class="w-full h-full object-cover"
           onerror="this.onerror=null; this.src='${safeFallback}';">
    `;
  }

  function openDrawer(){
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
  }

  function navigateTo(page){
    window.scrollTo({ top: 0, behavior: 'instant' });
    switch(page){
      case 'home': renderHome(); break;
      case 'about': renderAbout(); break;
      case 'self': renderShop('Аромати для себе', 'Ці аромати створені для знайомства з парфумерією без ризику.'); break;
      case 'home-scents': renderShop('Аромати для дому', 'Аромат у просторі — це атмосфера. Для відпочинку, роботи або затишку.'); break;
      case 'sets': renderSets(); break;
      case 'how-it-works': renderHowItWorks(); break;
      case 'faq': renderFAQ(); break;
      case 'contacts': renderContacts(); break;
      case 'delivery': renderTextPage('Доставка та оплата', 'Доставка здійснюється Новою Поштою по всій Україні.\n\nОплата: картка / переказ (додайте реальні умови).'); break;
      case 'returns': renderTextPage('Повернення та обмін', 'Згідно із законом України, парфумерія належної якості поверненню не підлягає.\n\nЯкщо є дефект/помилка комплектації — ми вирішимо це швидко.'); break;
      default: renderHome();
    }
  }

  function renderHome(){
    content.innerHTML = `
      <section class="fade-in min-h-[86vh] flex items-center relative overflow-hidden bg-[#faf9f6]">
        <div class="absolute right-0 top-0 w-1/2 h-full hidden md:block">
          <div class="w-full h-full opacity-95">
            ${imgWithFallback(ASSETS.hero, "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1400")}
          </div>
          <div class="absolute inset-0 bg-gradient-to-r from-[#faf9f6] via-transparent to-transparent"></div>
        </div>

        <div class="max-w-7xl mx-auto px-4 relative z-10 w-full">
          <div class="max-w-2xl">
            <span class="text-[10px] uppercase tracking-[0.4em] text-stone-400 mb-6 block">Онлайн-студія ароматів</span>
            <h1 class="text-6xl md:text-8xl mb-8 leading-[1.05]">Your <span class="italic font-light">Sun</span></h1>

            <div class="mb-10 space-y-2">
              <p class="slogan-accent">Your Sun не каже: «Купи цей аромат»</p>
              <p class="slogan-accent text-stone-800 font-medium italic">Your Sun каже: «Давай знайдемо твій»</p>
            </div>

            <p class="text-stone-500 mb-10 text-lg font-light leading-relaxed">
              Обирати аромат не обовʼязково складно. <br>
              Ми зібрали найпопулярніші — щоб ви могли спробувати і знайти свій.
            </p>

            <div class="flex flex-col sm:flex-row gap-5">
              <button onclick="navigateTo('self')" class="btn-primary">Аромати для себе</button>
              <button onclick="navigateTo('home-scents')" class="btn-outline">Аромати для дому</button>
            </div>
          </div>
        </div>
      </section>

      <section class="py-20 bg-white">
        <div class="max-w-5xl mx-auto px-4">
          <div class="text-center mb-12">
            <h2 class="text-4xl mb-3">Відчуйте атмосферу</h2>
            <p class="text-stone-400 uppercase tracking-widest text-[10px]">Короткий огляд нашої філософії</p>
          </div>

          <div class="video-container shadow-2xl bg-stone-100">
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="text-center">
                <i class="fa-solid fa-play text-5xl mb-4 text-stone-300"></i>
                <p class="text-stone-400 text-sm">Місце для відео (потім вставиш iframe або mp4)</p>
              </div>
            </div>
          </div>

          <div class="mt-6 text-center text-xs text-stone-400">
            Порада: якщо є YouTube/Vimeo — вставимо iframe, якщо є mp4 — вставимо &lt;video&gt;.
          </div>
        </div>
      </section>

      <section class="py-24 bg-[#fdfcfb]">
        <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-2 gap-16 items-center">
          <div class="relative">
            <div class="aspect-[3/4] rounded-[3rem] overflow-hidden shadow-xl bg-stone-100">
              ${imgWithFallback(ASSETS.idea1, "https://images.unsplash.com/photo-1615485290382-441e4d0c9cb5?auto=format&fit=crop&q=80&w=1400")}
            </div>
            <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-white p-4 rounded-3xl shadow-2xl hidden md:block">
              <div class="w-full h-full rounded-2xl overflow-hidden bg-stone-100">
                ${imgWithFallback(ASSETS.idea2, "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&q=80&w=900")}
              </div>
            </div>
          </div>

          <div>
            <h2 class="text-5xl mb-8 leading-tight">Чому ми створили Your Sun</h2>
            <div class="space-y-5 text-stone-600 leading-relaxed font-light text-lg">
              <p class="italic serif text-xl text-black">«Який аромат обрати?» — це питання ми чуємо найчастіше.</p>
              <p>У світі парфумерії нескінченна кількість запахів, і саме це ускладнює вибір.</p>
              <p>Тому ми створили онлайн-студію ароматів — простір, де можна спокійно тестувати, порівнювати і знаходити "свій" аромат без поспіху та ризику.</p>
            </div>
            <button onclick="navigateTo('about')" class="mt-10 text-sm font-bold uppercase tracking-widest border-b border-black pb-2 hover:text-stone-500 hover:border-stone-500 transition-colors">
              Наша історія
            </button>
          </div>
        </div>
      </section>

      <section class="py-24 bg-white">
        <div class="max-w-7xl mx-auto px-4">
          <div class="grid md:grid-cols-4 gap-8">
            ${['Аромати для себе','Аромати для дому','Сети для знайомства','Подарункові набори'].map((cat,idx)=>`
              <div class="group cursor-pointer" onclick="navigateTo('${idx===1?'home-scents':'self'}')">
                <div class="aspect-[4/5] bg-stone-50 rounded-[2rem] mb-5 overflow-hidden flex items-center justify-center relative">
                  <div class="text-stone-200 uppercase tracking-widest text-[10px] group-hover:scale-110 transition-transform duration-700">
                    Image Placeholder
                  </div>
                  <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors"></div>
                </div>
                <h3 class="text-center text-xs font-bold uppercase tracking-[0.2em]">${cat}</h3>
              </div>
            `).join('')}
          </div>
        </div>
      </section>
    `;
  }

  function renderShop(title, description){
    const colors = ['#008080','#FFD700','#C0C0C0','#4B0082','#FFB6C1','#0000FF'];
    content.innerHTML = `
      <div class="fade-in max-w-7xl mx-auto px-4 py-16">
        <header class="mb-14">
          <h1 class="text-5xl md:text-6xl mb-5">${title}</h1>
          <p class="text-stone-400 font-light max-w-2xl text-lg">${description}</p>
          <div class="mt-6 flex gap-3 text-[10px] uppercase tracking-widest font-bold">
            <span class="text-stone-300">Об'єми:</span>
            <span>2 мл</span><span class="text-stone-200">/</span><span>3 мл</span><span class="text-stone-200">/</span><span>5 мл</span>
          </div>
        </header>

        <div class="grid md:grid-cols-3 gap-x-10 gap-y-16">
          ${[1,2,3,4,5,6].map(i=>`
            <div class="product-card group">
              <div class="aspect-[3/4] rounded-[2.5rem] bg-[#f8f6f4] mb-7 overflow-hidden relative flex flex-col items-center justify-center p-10">
                <div class="product-media w-12 h-40 rounded-full shadow-2xl" style="background:${colors[i-1]}; border:2px solid rgba(255,255,255,.25);">
                  <div class="w-full h-1/4 border-b border-white/20"></div>
                </div>
                <div class="mt-7 text-[10px] text-stone-300 uppercase tracking-tighter">Travel Atomizer</div>
              </div>

              <h3 class="text-2xl mb-2">Назва аромату №${i}</h3>
              <p class="text-stone-400 text-sm font-light mb-5 leading-relaxed">
                Цей аромат — про стан, а не про ноти. Він звучить індивідуально на кожному.
              </p>

              <div class="flex gap-2 mb-6">
                ${['2ml','3ml','5ml'].map(size=>`
                  <button class="flex-1 py-3 text-[10px] border border-stone-100 rounded-xl hover:border-black transition-all uppercase tracking-widest">${size}</button>
                `).join('')}
              </div>

              <button class="w-full btn-primary" style="padding-top:14px;padding-bottom:14px;">Додати до кошика</button>
              <p class="mt-3 text-[9px] text-center text-stone-300 uppercase tracking-widest italic">
                Розлив у стерильних умовах
              </p>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderAbout(){
    content.innerHTML = `
      <div class="fade-in py-20">
        <div class="max-w-4xl mx-auto px-4">
          <h1 class="text-6xl md:text-7xl mb-12 text-center">Про нас</h1>

          <div class="grid md:grid-cols-2 gap-12 mb-16 items-center">
            <div class="aspect-square rounded-full overflow-hidden bg-stone-100">
              ${imgWithFallback("./about.jpg", "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&q=80&w=1200")}
            </div>
            <div class="space-y-5">
              <p class="text-2xl italic serif leading-relaxed">Ми — дві подруги, які щиро обожнюють парфумерію.</p>
              <p class="text-stone-500 font-light">
                Довгий час ми спостерігали, як люди губляться серед сотень ароматів і не знають, з чого почати.
              </p>
            </div>
          </div>

          <div class="text-stone-600 font-light leading-relaxed space-y-6 text-lg">
            <p>Купівля парфумів часто перетворюється на ризик — запах подобається в магазині, але зовсім інакше розкривається з часом.</p>

    `;

  function toggleFaq(i){
    const el = document.getElementById('faqBody'+i);
    const ic = document.getElementById('faqIcon'+i);
    const isOpen = !el.classList.contains('hidden');
    if (isOpen) {
      el.classList.add('hidden');
      ic.classList.remove('fa-minus');
      ic.classList.add('fa-plus');
    } else {
      el.classList.remove('hidden');
      ic.classList.remove('fa-plus');
      ic.classList.add('fa-minus');
    }
  }
