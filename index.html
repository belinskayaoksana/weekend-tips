<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance Studio — Онлайн-студія ароматів</title>
    <!-- Підключення React, Tailwind та Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ВЛАСНІ КОМПОНЕНТИ ІКОНОК (SVG) ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const MenuIcon = (props) => <Icon {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
        const XIcon = (props) => <Icon {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const ShoppingBagIcon = (props) => <Icon {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></Icon>;
        const InstagramIcon = (props) => <Icon {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></Icon>;
        const SendIcon = (props) => <Icon {...props}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></Icon>;
        const ChevronDownIcon = (props) => <Icon {...props}><path d="m6 9 6 6 6-6"/></Icon>;
        const ChevronUpIcon = (props) => <Icon {...props}><path d="m18 15-6-6-6 6"/></Icon>;

        // --- ВАШІ ФОТО З GITHUB ---
        const REPO_URL = "https://raw.githubusercontent.com/belinskayaoksana/weekend-tips/main/";
        const IMAGES = {
            heroLeft: `${REPO_URL}unnamed.jpg`, 
            heroRight: `${REPO_URL}Gemini_Generated_Image_ojp4wwojp4wwojp4.png`,
            atomizer1: `${REPO_URL}Gemini_Generated_Image_ln2iqdln2iqdln2i.png`,
            atomizer2: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=1974&auto=format&fit=crop",
            atomizer3: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?q=80&w=1974&auto=format&fit=crop",
            atomizer4: "https://images.unsplash.com/photo-1512201066735-b5a6bc8aa097?q=80&w=2070&auto=format&fit=crop",
            aboutUs: "https://images.unsplash.com/photo-1556745753-b2904692b3cd?q=80&w=2073&auto=format&fit=crop",
            productPlaceholder: `${REPO_URL}Gemini_Generated_Image_ojp4wwojp4wwojp4.png`
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [expandedFaq, setExpandedFaq] = useState(null);

            const navigate = (page) => {
                setCurrentPage(page);
                setIsMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const Header = () => (
                <nav className="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 border-b border-stone-100">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            <div className="flex-shrink-0 cursor-pointer" onClick={() => navigate('home')}>
                                <h1 className="text-xl tracking-[0.2em] font-light uppercase">Fragrance <span className="font-bold">Studio</span></h1>
                            </div>
                            <div className="hidden md:flex space-x-8 text-sm uppercase tracking-widest font-medium text-stone-600">
                                <button onClick={() => navigate('home')} className={`hover:text-black transition ${currentPage === 'home' ? 'text-black border-b border-black' : ''}`}>Головна</button>
                                <button onClick={() => navigate('scents')} className={`hover:text-black transition ${currentPage === 'scents' ? 'text-black border-b border-black' : ''}`}>Аромати</button>
                                <button onClick={() => navigate('about')} className={`hover:text-black transition ${currentPage === 'about' ? 'text-black border-b border-black' : ''}`}>Про нас</button>
                                <button onClick={() => navigate('faq')} className={`hover:text-black transition ${currentPage === 'faq' ? 'text-black border-b border-black' : ''}`}>FAQ</button>
                            </div>
                            <div className="flex items-center space-x-4">
                                <ShoppingBagIcon size={20} className="cursor-pointer text-stone-600 hover:text-black" />
                                <div className="md:hidden cursor-pointer" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    {isMenuOpen ? <XIcon size={24} /> : <MenuIcon size={24} />}
                                </div>
                            </div>
                        </div>
                    </div>
                    {/* Мобільне меню */}
                    {isMenuOpen && (
                        <div className="md:hidden bg-white border-b border-stone-100 py-6 px-4 space-y-4 shadow-lg animate-in slide-in-from-top duration-300">
                            <button onClick={() => navigate('home')} className="block w-full text-left uppercase text-sm tracking-widest font-medium text-stone-600">Головна</button>
                            <button onClick={() => navigate('scents')} className="block w-full text-left uppercase text-sm tracking-widest font-medium text-stone-600">Аромати</button>
                            <button onClick={() => navigate('about')} className="block w-full text-left uppercase text-sm tracking-widest font-medium text-stone-600">Про нас</button>
                            <button onClick={() => navigate('faq')} className="block w-full text-left uppercase text-sm tracking-widest font-medium text-stone-600">FAQ</button>
                        </div>
                    )}
                </nav>
            );

            const HomePage = () => (
                <div className="pt-20">
                    <section className="relative h-[85vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 flex flex-col md:flex-row">
                            <img src={IMAGES.heroLeft} className="w-full md:w-1/2 h-full object-cover" alt="Lifestyle" />
                            <img src={IMAGES.heroRight} className="w-full md:w-1/2 h-full object-cover" alt="Product" />
                        </div>
                        <div className="relative z-10 text-center bg-white/70 backdrop-blur-md p-10 md:p-16 border border-white/50 shadow-xl max-w-2xl mx-4 rounded-sm">
                            <h2 className="text-3xl md:text-5xl font-light uppercase tracking-widest mb-4">Студія ароматів</h2>
                            <p className="text-stone-700 mb-8 italic">Знайдіть свій ідеальний стан через нішеву парфумерію</p>
                            <button onClick={() => navigate('scents')} className="px-10 py-4 bg-stone-900 text-white uppercase tracking-widest text-xs font-bold hover:bg-stone-800 transition">До каталогу</button>
                        </div>
                    </section>

                    <section className="py-20 px-4 bg-white max-w-7xl mx-auto">
                        <h3 className="text-center text-xl uppercase tracking-widest mb-12 font-light">Популярні атомайзери</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {[IMAGES.atomizer1, IMAGES.atomizer2, IMAGES.atomizer3, IMAGES.atomizer4].map((img, i) => (
                                <div key={i} className="relative overflow-hidden group h-64 md:h-80">
                                    <img src={img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-700 transform group-hover:scale-105" alt={`Atomizer ${i + 1}`} />
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );

            const Catalog = () => (
                <div className="pt-32 px-4 max-w-7xl mx-auto min-h-screen">
                    <h2 className="text-2xl font-light uppercase tracking-widest mb-12">Колекція ароматів</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-8">
                        {[1, 2, 3, 4, 5, 6].map(i => (
                            <div key={i} className="group">
                                <div className="aspect-[3/4] bg-stone-100 overflow-hidden mb-4 relative">
                                    <img src={IMAGES.productPlaceholder} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt={`Perfume ${i}`} />
                                    <div className="absolute top-3 left-3 bg-white/80 px-2 py-1 text-[8px] uppercase tracking-widest font-bold">New</div>
                                </div>
                                <h4 className="text-sm font-bold uppercase tracking-widest">Аромат №{i}</h4>
                                <p className="text-xs text-stone-400 mb-4 uppercase tracking-tighter">2мл / 3мл / 5мл</p>
                                <button className="text-[10px] font-bold border-b border-black uppercase pb-1 hover:text-stone-400 transition">Додати</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const AboutPage = () => (
                <div className="pt-32 px-4 max-w-4xl mx-auto min-h-screen">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                        <img src={IMAGES.aboutUs} className="w-full aspect-[4/5] object-cover shadow-2xl rounded-sm" alt="About us" />
                        <div className="space-y-6">
                            <h2 className="text-3xl font-light uppercase tracking-widest">Про нас</h2>
                            <p className="text-stone-600 leading-relaxed italic">Ми — команда поціновувачів парфумерії, які вірять, що аромат — це не просто запах, а настрій та спосіб самовираження.</p>
                            <p className="text-stone-600 leading-relaxed">Нашою метою було створити зручний сервіс, де кожен може спробувати рідкісні та нішеві аромати без необхідності купувати цілий флакон.</p>
                        </div>
                    </div>
                </div>
            );

            const FAQPage = () => {
                const faqs = [
                    { q: "Який об'єм обрати?", a: "Для знайомства ідеально підходить 2мл. 5мл вистачить на 2-3 тижні щоденного використання." },
                    { q: "Чи оригінальні аромати?", a: "Так, ми працюємо лише з перевіреними постачальниками та оригінальною продукцією." },
                    { q: "Яка доставка?", a: "Відправляємо Новою Поштою протягом 1-2 днів після замовлення." }
                ];
                return (
                    <div className="pt-32 px-4 max-w-2xl mx-auto min-h-screen">
                        <h2 className="text-2xl font-light uppercase tracking-widest mb-12 text-center">FAQ</h2>
                        <div className="space-y-4">
                            {faqs.map((faq, idx) => (
                                <div key={idx} className="border-b border-stone-100 pb-4">
                                    <button 
                                        className="w-full flex justify-between items-center text-left py-2 font-bold uppercase text-xs tracking-widest text-stone-800"
                                        onClick={() => setExpandedFaq(expandedFaq === idx ? null : idx)}
                                    >
                                        {faq.q}
                                        {expandedFaq === idx ? <ChevronUpIcon size={16}/> : <ChevronDownIcon size={16}/>}
                                    </button>
                                    {expandedFaq === idx && (
                                        <div className="mt-2 text-sm text-stone-500 italic leading-relaxed animate-in fade-in duration-300">
                                            {faq.a}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const Footer = () => (
                <footer className="bg-stone-50 py-12 px-4 mt-20 border-t border-stone-100">
                    <div className="max-w-7xl mx-auto text-center space-y-6">
                        <h2 className="text-lg font-bold uppercase tracking-widest">Fragrance Studio</h2>
                        <div className="flex justify-center space-x-6">
                            <InstagramIcon size={20} className="text-stone-400 hover:text-black cursor-pointer transition" />
                            <SendIcon size={20} className="text-stone-400 hover:text-black cursor-pointer transition" />
                        </div>
                        <p className="text-[10px] text-stone-400 uppercase tracking-widest">© 2024 belinskayaoksana — Fragrance Studio</p>
                    </div>
                </footer>
            );

            return (
                <div className="min-h-screen bg-white">
                    <Header />
                    {currentPage === 'home' && <HomePage />}
                    {currentPage === 'scents' && <Catalog />}
                    {currentPage === 'about' && <AboutPage />}
                    {currentPage === 'faq' && <FAQPage />}
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
