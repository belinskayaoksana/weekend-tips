<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Sun | Онлайн-студія ароматів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
        
        :root {
            --brand-gold: #d4af37;
            --brand-bg: #fdfcfb;
            --brand-dark: #1a1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-bg);
            color: var(--brand-dark);
        }
        
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slogan-accent {
            @apply text-xl md:text-2xl italic text-gray-400 font-light leading-relaxed;
        }

        .btn-primary {
            @apply bg-[#1a1a1a] text-white px-10 py-4 rounded-full hover:bg-black transition-all duration-300 text-xs uppercase tracking-[0.2em];
        }

        .btn-outline {
            @apply border border-[#1a1a1a] text-[#1a1a1a] px-10 py-4 rounded-full hover:bg-[#1a1a1a] hover:text-white transition-all duration-300 text-xs uppercase tracking-[0.2em];
        }

        .product-card img {
            transition: transform 0.5s ease;
        }
        .product-card:hover img {
            transform: scale(1.05);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 2rem;
        }
        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-gray-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-24 items-center">
                <div class="flex-shrink-0 cursor-pointer" onclick="navigateTo('home')">
                    <span class="text-2xl tracking-[0.3em] font-light uppercase">Your <span class="font-bold">Sun</span></span>
                </div>
                
                <div class="hidden md:flex space-x-10 text-[10px] font-bold uppercase tracking-[0.2em]">
                    <button onclick="navigateTo('home')" class="hover:text-gray-400 transition-colors">Головна</button>
                    <div class="relative group">
                        <button class="hover:text-gray-400 transition-colors">Аромати <i class="fa-solid fa-chevron-down text-[8px] ml-1"></i></button>
                        <div class="absolute hidden group-hover:block w-48 bg-white shadow-2xl mt-4 py-4 border border-gray-50">
                            <button onclick="navigateTo('self')" class="block px-6 py-2 hover:bg-gray-50 w-full text-left">Для себе</button>
                            <button onclick="navigateTo('home-scents')" class="block px-6 py-2 hover:bg-gray-50 w-full text-left">Для дому</button>
                        </div>
                    </div>
                    <button onclick="navigateTo('sets')" class="hover:text-gray-400 transition-colors">Сети</button>
                    <button onclick="navigateTo('how-it-works')" class="hover:text-gray-400 transition-colors">Як це працює</button>
                    <button onclick="navigateTo('about')" class="hover:text-gray-400 transition-colors">Про нас</button>
                    <button onclick="navigateTo('faq')" class="hover:text-gray-400 transition-colors">FAQ</button>
                    <button onclick="navigateTo('contacts')" class="hover:text-gray-400 transition-colors">Контакти</button>
                </div>

                <div class="flex items-center space-x-5">
                    <button class="text-sm"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="text-sm relative">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span class="absolute -top-2 -right-2 bg-black text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
                    </button>
                    <button id="mobile-menu-button" class="md:hidden text-xl">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main id="content">
        <!-- Home Page Rendered Below -->
    </main>

    <!-- Footer -->
    <footer class="bg-white pt-24 pb-12 border-t border-gray-100">
        <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-4 gap-16 mb-20">
            <div class="col-span-1 md:col-span-1">
                <span class="text-xl tracking-[0.3em] font-light uppercase">Your <span class="font-bold">Sun</span></span>
                <p class="mt-6 text-gray-400 text-sm leading-relaxed font-light italic">
                    "Your Sun не каже: «Купи цей аромат» <br>Your Sun каже: «Давай знайдемо твій»"
                </p>
            </div>
            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-widest mb-8">Службові сторінки</h4>
                <ul class="space-y-4 text-sm text-gray-500 font-light">
                    <li><button onclick="navigateTo('delivery')" class="hover:text-black">Доставка та оплата</button></li>
                    <li><button onclick="navigateTo('returns')" class="hover:text-black">Повернення та обмін</button></li>
                    <li><button class="hover:text-black">Публічна оферта</button></li>
                    <li><button class="hover:text-black">Політика конфіденційності</button></li>
                </ul>
            </div>
            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-widest mb-8">Студія</h4>
                <ul class="space-y-4 text-sm text-gray-500 font-light">
                    <li><button onclick="navigateTo('about')" class="hover:text-black">Історія бренду</button></li>
                    <li><button onclick="navigateTo('sets')" class="hover:text-black">Подарункові набори</button></li>
                    <li><button onclick="navigateTo('contacts')" class="hover:text-black">Зв'язатися з нами</button></li>
                </ul>
            </div>
            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-widest mb-8">Соціальні мережі</h4>
                <div class="flex space-x-6">
                    <a href="#" class="text-gray-400 hover:text-black transition-colors"><i class="fa-brands fa-instagram text-xl"></i></a>
                    <a href="#" class="text-gray-400 hover:text-black transition-colors"><i class="fa-brands fa-telegram text-xl"></i></a>
                    <a href="#" class="text-gray-400 hover:text-black transition-colors"><i class="fa-brands fa-whatsapp text-xl"></i></a>
                </div>
            </div>
        </div>
        <div class="text-center text-[10px] uppercase tracking-widest text-gray-300">
            &copy; 2024 Your Sun Studio. Made with love for your senses.
        </div>
    </footer>
</div>

<script>
    const content = document.getElementById('content');

    function navigateTo(page) {
        window.scrollTo(0, 0);
        switch(page) {
            case 'home': renderHome(); break;
            case 'about': renderAbout(); break;
            case 'self': renderShop('Аромати для себе', 'Ці аромати створені для знайомства з парфумерією без ризику.'); break;
            case 'home-scents': renderShop('Аромати для дому', 'Аромат у просторі — це атмосфера. Для відпочинку, роботи або затишку.'); break;
            case 'sets': renderSets(); break;
            case 'how-it-works': renderHowItWorks(); break;
            case 'faq': renderFAQ(); break;
            case 'contacts': renderContacts(); break;
            case 'delivery': renderTextPage('Доставка та оплата', 'Доставка здійснюється Новою Поштою по всій Україні.'); break;
            case 'returns': renderTextPage('Повернення та обмін', 'Згідно із законом України, парфумерія належної якості поверненню не підлягає.'); break;
            default: renderHome();
        }
    }

    function renderHome() {
        content.innerHTML = `
            <!-- Hero Block -->
            <section class="fade-in min-h-[90vh] flex items-center relative overflow-hidden bg-[#faf9f6]">
                <div class="absolute right-0 top-0 w-1/2 h-full hidden md:block">
                    <div class="w-full h-full bg-cover bg-center opacity-90" style="background-image: url('https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=1000');"></div>
                    <div class="absolute inset-0 bg-gradient-to-r from-[#faf9f6] via-transparent to-transparent"></div>
                </div>
                
                <div class="max-w-7xl mx-auto px-4 relative z-10 w-full">
                    <div class="max-w-2xl">
                        <span class="text-[10px] uppercase tracking-[0.4em] text-gray-400 mb-6 block">Онлайн-студія ароматів</span>
                        <h1 class="text-6xl md:text-8xl mb-8 leading-[1.1]">Your <span class="italic font-light">Sun</span></h1>
                        
                        <div class="mb-12 space-y-2">
                            <p class="slogan-accent">Your Sun не каже: «Купи цей аромат»</p>
                            <p class="slogan-accent text-gray-800 font-medium italic">Your Sun каже: «Давай знайдемо твій»</p>
                        </div>

                        <p class="text-gray-500 mb-12 text-lg font-light leading-relaxed">
                            Обирати аромат не обовʼязково складно. <br>
                            Ми зібрали найпопулярніші — щоб ви могли спробувати і знайти свій.
                        </p>

                        <div class="flex flex-col sm:flex-row gap-6">
                            <button onclick="navigateTo('self')" class="btn-primary">Аромати для себе</button>
                            <button onclick="navigateTo('home-scents')" class="btn-outline">Аромати для дому</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Video Section -->
            <section class="py-24 bg-white">
                <div class="max-w-5xl mx-auto px-4">
                    <div class="text-center mb-16">
                        <h2 class="text-4xl mb-4">Відчуйте атмосферу</h2>
                        <p class="text-gray-400 uppercase tracking-widest text-[10px]">Короткий огляд нашої філософії</p>
                    </div>
                    <div class="video-container shadow-2xl">
                        <!-- Placeholder for Brand Video -->
                        <div class="absolute inset-0 bg-gray-100 flex items-center justify-center">
                            <div class="text-center">
                                <i class="fa-solid fa-play text-5xl mb-4 text-gray-300"></i>
                                <p class="text-gray-400 text-sm">Відео про розпаковку та тестування</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Idea Block -->
            <section class="py-32 bg-[#fdfcfb]">
                <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-2 gap-24 items-center">
                    <div class="relative">
                        <div class="aspect-[3/4] rounded-[3rem] overflow-hidden shadow-xl">
                            <img src="https://images.unsplash.com/photo-1615485290382-441e4d0c9cb5?auto=format&fit=crop&q=80&w=1000" alt="Scent testing" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-white p-4 rounded-3xl shadow-2xl hidden md:block">
                            <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&q=80&w=500" class="w-full h-full object-cover rounded-2xl">
                        </div>
                    </div>
                    <div>
                        <h2 class="text-5xl mb-10 leading-tight">Чому ми створили Your Sun</h2>
                        <div class="space-y-6 text-gray-600 leading-relaxed font-light text-lg">
                            <p class="italic serif text-xl text-black">«Який аромат обрати?» — це питання ми чуємо найчастіше.</p>
                            <p>У світі парфумерії нескінченна кількість запахів, і саме це ускладнює вибір.</p>
                            <p>Тому ми створили онлайн-студію ароматів — простір, де можна спокійно тестувати, порівнювати і знаходити "свій" аромат без поспіху та ризику.</p>
                        </div>
                        <button onclick="navigateTo('about')" class="mt-12 text-sm font-bold uppercase tracking-widest border-b border-black pb-2">Наша історія</button>
                    </div>
                </div>
            </section>

            <!-- Categories -->
            <section class="py-32 bg-white">
                <div class="max-w-7xl mx-auto px-4">
                    <div class="grid md:grid-cols-4 gap-8">
                        ${['Аромати для себе', 'Аромати для дому', 'Сети для знайомства', 'Подарункові набори'].map(cat => `
                            <div class="group cursor-pointer" onclick="navigateTo('self')">
                                <div class="aspect-[4/5] bg-gray-50 rounded-[2rem] mb-6 overflow-hidden flex items-center justify-center relative">
                                    <div class="text-gray-200 uppercase tracking-widest text-[10px] group-hover:scale-110 transition-transform duration-700">Image Placeholder</div>
                                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors"></div>
                                </div>
                                <h3 class="text-center text-xs font-bold uppercase tracking-[0.2em]">${cat}</h3>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
        `;
    }

    function renderShop(title, description) {
        // Використовуємо референс з кольоровими атомайзерами для карток
        const colors = ['#008080', '#FFD700', '#C0C0C0', '#4B0082', '#FFB6C1', '#0000FF'];
        content.innerHTML = `
            <div class="fade-in max-w-7xl mx-auto px-4 py-24">
                <header class="mb-20">
                    <h1 class="text-6xl mb-6">${title}</h1>
                    <p class="text-gray-400 font-light max-w-2xl text-lg">${description}</p>
                    <div class="mt-8 flex gap-4 text-[10px] uppercase tracking-widest font-bold">
                        <span class="text-gray-300">Об'єми:</span>
                        <span>2 мл</span> / <span>3 мл</span> / <span>5 мл</span>
                    </div>
                </header>
                
                <div class="grid md:grid-cols-3 gap-x-12 gap-y-20">
                    ${[1, 2, 3, 4, 5, 6].map(i => `
                        <div class="product-card group">
                            <div class="aspect-[3/4] rounded-[2.5rem] bg-[#f8f6f4] mb-8 overflow-hidden relative flex flex-col items-center justify-center p-12">
                                <!-- Визуалізація кольорового атомайзера як на фото -->
                                <div class="w-12 h-40 rounded-full shadow-2xl transition-transform group-hover:rotate-12 duration-500" style="background: ${colors[i-1]}; border: 2px solid rgba(255,255,255,0.2)">
                                    <div class="w-full h-1/4 border-b border-white/20"></div>
                                </div>
                                <div class="mt-8 text-[10px] text-gray-300 uppercase tracking-tighter">Travel Atomizer</div>
                            </div>
                            <h3 class="text-2xl mb-3">Назва аромату №${i}</h3>
                            <p class="text-gray-400 text-sm font-light mb-6 leading-relaxed">Цей аромат — про стан, а не про ноти. Він звучить індивідуально на кожному.</p>
                            
                            <div class="flex gap-2 mb-8">
                                ${['2ml', '3ml', '5ml'].map(size => `
                                    <button class="flex-1 py-3 text-[10px] border border-gray-100 rounded-xl hover:border-black transition-all uppercase tracking-widest">${size}</button>
                                `).join('')}
                            </div>
                            
                            <button class="w-full btn-primary !py-4">Додати до кошика</button>
                            <p class="mt-4 text-[9px] text-center text-gray-300 uppercase tracking-widest italic">Розлив у стерильних умовах</p>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderAbout() {
        content.innerHTML = `
            <div class="fade-in py-32">
                <div class="max-w-4xl mx-auto px-4">
                    <h1 class="text-7xl mb-16 text-center">Про нас</h1>
                    
                    <div class="grid md:grid-cols-2 gap-16 mb-24 items-center">
                        <div class="aspect-square rounded-full overflow-hidden bg-gray-100">
                             <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000">
                        </div>
                        <div class="space-y-6">
                            <p class="text-2xl italic serif leading-relaxed">Ми — дві подруги, які щиро обожнюють парфумерію.</p>
                            <p class="text-gray-500 font-light">Довгий час ми спостерігали, як люди губляться серед сотень ароматів і не знають, з чого почати.</p>
                        </div>
                    </div>

                    <div class="prose prose-lg max-w-none text-gray-600 font-light space-y-8">
                        <p>Купівля парфумів часто перетворюється на ризик — запах подобається в магазині, але зовсім інакше розкривається з часом.</p>
                        <p>Так зʼявилась ідея створити <span class="text-black font-medium">Your Sun</span> — онлайн-студію ароматів, де можна спокійно тестувати, відчувати і знаходити “свій” аромат.</p>
                        
                        <div class="py-12 border-y border-gray-100 my-16">
                            <h3 class="text-black text-center text-sm uppercase tracking-[0.3em] mb-12 font-bold">Ми відібрали найкраще для вас:</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                                <div>
                                    <p class="text-xs uppercase tracking-widest font-bold mb-2">Для молоді</p>
                                    <p class="text-sm italic">З характером та драйвом</p>
                                </div>
                                <div>
                                    <p class="text-xs uppercase tracking-widest font-bold mb-2">Для жінок</p>
                                    <p class="text-sm italic">Які точно знають, чого хочуть</p>
                                </div>
                                <div>
                                    <p class="text-xs uppercase tracking-widest font-bold mb-2">Для шукачів</p>
                                    <p class="text-sm italic">Хто любить експерименти</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderHowItWorks() {
        const steps = [
            "Обираєте аромати або сет",
            "Оформлюєте замовлення",
            "Отримуєте посилку Новою Поштою",
            "Тестуєте аромати у зручний час",
            "Обираєте той, який підходить саме вам"
        ];
        content.innerHTML = `
            <div class="fade-in max-w-4xl mx-auto px-4 py-32">
                <h1 class="text-6xl mb-24 text-center">Як це працює</h1>
                <div class="space-y-24">
                    ${steps.map((step, i) => `
                        <div class="flex gap-12 items-center ${i % 2 === 0 ? '' : 'flex-row-reverse text-right'}">
                            <div class="text-9xl font-thin text-gray-50 opacity-20">${i+1}</div>
                            <div class="flex-1">
                                <h3 class="text-3xl font-light">${step}</h3>
                            </div>
                            <div class="hidden md:block w-32 h-[1px] bg-gray-100"></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderSets() {
        content.innerHTML = `
            <div class="fade-in max-w-7xl mx-auto px-4 py-32">
                <div class="text-center mb-24">
                    <h1 class="text-6xl mb-6">Сети ароматів</h1>
                    <p class="text-gray-400 text-lg font-light">Найзручніший спосіб познайомитися з парфумерією.</p>
                </div>

                <div class="grid md:grid-cols-2 gap-12">
                    <div class="bg-black text-white p-20 rounded-[3rem] flex flex-col justify-between aspect-square md:aspect-auto">
                        <div>
                            <span class="text-[10px] uppercase tracking-[0.4em] opacity-50 mb-4 block">Готові рішення</span>
                            <h2 class="text-4xl mb-8">Найпопулярніші сети</h2>
                            <ul class="space-y-4 text-gray-400 font-light italic">
                                <li>— Сет "Бестселери місяця"</li>
                                <li>— Сет "Для особливого настрою"</li>
                                <li>— Сет "Атмосфера дому"</li>
                            </ul>
                        </div>
                        <button class="bg-white text-black py-5 rounded-full uppercase text-[10px] font-bold tracking-widest mt-12 hover:bg-gray-100 transition-colors">Переглянути сети</button>
                    </div>
                    
                    <div class="border border-gray-100 p-20 rounded-[3rem] flex flex-col justify-between aspect-square md:aspect-auto">
                        <div>
                            <span class="text-[10px] uppercase tracking-[0.4em] text-gray-300 mb-4 block">Творчий підхід</span>
                            <h2 class="text-4xl mb-8">Збери набір вручну</h2>
                            <p class="text-gray-500 font-light leading-relaxed">Обирайте будь-які аромати з нашої колекції, а ми дбайливо запакуємо їх у ваш персональний сет.</p>
                        </div>
                        <button onclick="navigateTo('self')" class="btn-outline mt-12">Почати вибір</button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderFAQ() {
        const faqs = [
            { q: "Як обрати аромат?", a: "Ви можете прочитати опис на сайті або написати нашому консультанту в Telegram чи WhatsApp." },
            { q: "Чи можна зібрати сет вручну?", a: "Так, ви можете самостійно обрати аромати." },
            { q: "Які обʼєми доступні?", a: "2 мл, 3 мл або 5 мл." },
            { q: "Чи можна скасувати замовлення?", a: "Так, якщо замовлення ще не відправлене." },
