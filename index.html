<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance Studio — Онлайн-студія ароматів</title>
    <!-- Підключення React, Tailwind та Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Menu, X, ShoppingBag, ArrowRight, Instagram, 
            Send, MessageCircle, ChevronDown, ChevronUp, Check 
        } = lucide;

        // --- ВАШІ ФОТО З GITHUB ---
        const REPO_URL = "https://raw.githubusercontent.com/belinskayaoksana/weekend-tips/main/";
        const IMAGES = {
            heroLeft: `${REPO_URL}unnamed.jpg`, 
            heroRight: `${REPO_URL}Gemini_Generated_Image_ojp4wwojp4wwojp4.png`,
            atomizer1: `${REPO_URL}Gemini_Generated_Image_ln2iqdln2iqdln2i.png`,
            atomizer2: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=1974&auto=format&fit=crop",
            atomizer3: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?q=80&w=1974&auto=format&fit=crop",
            atomizer4: "https://images.unsplash.com/photo-1512201066735-b5a6bc8aa097?q=80&w=2070&auto=format&fit=crop",
            aboutUs: "https://images.unsplash.com/photo-1556745753-b2904692b3cd?q=80&w=2073&auto=format&fit=crop",
            productPlaceholder: `${REPO_URL}Gemini_Generated_Image_ojp4wwojp4wwojp4.png`
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [expandedFaq, setExpandedFaq] = useState(null);

            const navigate = (page) => {
                setCurrentPage(page);
                setIsMenuOpen(false);
                window.scrollTo(0, 0);
            };

            const Header = () => (
                <nav className="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 border-b border-stone-100">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            <div className="flex-shrink-0 cursor-pointer" onClick={() => navigate('home')}>
                                <h1 className="text-xl tracking-[0.2em] font-light uppercase">Fragrance <span className="font-bold">Studio</span></h1>
                            </div>
                            <div className="hidden md:flex space-x-8 text-sm uppercase tracking-widest font-medium text-stone-600">
                                <button onClick={() => navigate('home')} className="hover:text-black transition">Головна</button>
                                <button onClick={() => navigate('scents')} className="hover:text-black transition">Аромати</button>
                                <button onClick={() => navigate('about')} className="hover:text-black transition">Про нас</button>
                                <button onClick={() => navigate('faq')} className="hover:text-black transition">FAQ</button>
                            </div>
                            <div className="flex items-center space-x-4">
                                <ShoppingBag size={20} className="cursor-pointer" />
                                <div className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            );

            const HomePage = () => (
                <div className="pt-20">
                    <section className="relative h-[85vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 flex flex-col md:flex-row">
                            <img src={IMAGES.heroLeft} className="w-full md:w-1/2 h-full object-cover" alt="Hero 1" />
                            <img src={IMAGES.heroRight} className="w-full md:w-1/2 h-full object-cover" alt="Hero 2" />
                        </div>
                        <div className="relative z-10 text-center bg-white/60 backdrop-blur-md p-10 md:p-16 border border-white/50 shadow-xl max-w-2xl mx-4">
                            <h2 className="text-3xl md:text-5xl font-light uppercase tracking-widest mb-4">Студія ароматів</h2>
                            <p className="text-stone-700 mb-8 italic">Знайдіть свій ідеальний стан через нішеву парфумерію</p>
                            <button onClick={() => navigate('scents')} className="px-10 py-4 bg-stone-900 text-white uppercase tracking-widest text-xs font-bold hover:bg-stone-800 transition">До каталогу</button>
                        </div>
                    </section>

                    <section className="py-20 px-4 bg-white max-w-7xl mx-auto">
                        <h3 className="text-center text-xl uppercase tracking-widest mb-12">Популярні атомайзери</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {[IMAGES.atomizer1, IMAGES.atomizer2, IMAGES.atomizer3, IMAGES.atomizer4].map((img, i) => (
                                <img key={i} src={img} className="w-full h-64 object-cover grayscale hover:grayscale-0 transition duration-500 rounded-sm" />
                            ))}
                        </div>
                    </section>
                </div>
            );

            const Catalog = () => (
                <div className="pt-32 px-4 max-w-7xl mx-auto min-h-screen">
                    <h2 className="text-2xl uppercase tracking-widest mb-12">Колекція ароматів</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-8">
                        {[1, 2, 3, 4, 5, 6].map(i => (
                            <div key={i} className="group">
                                <div className="aspect-[3/4] bg-stone-100 overflow-hidden mb-4">
                                    <img src={IMAGES.productPlaceholder} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" />
                                </div>
                                <h4 className="text-sm font-bold uppercase tracking-widest">Аромат №{i}</h4>
                                <p className="text-xs text-stone-400 mb-4 uppercase">2мл / 3мл / 5мл</p>
                                <button className="text-[10px] font-bold border-b border-black uppercase pb-1">Додати</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const Footer = () => (
                <footer className="bg-stone-50 py-12 px-4 mt-20 border-t border-stone-100">
                    <div className="max-w-7xl mx-auto text-center space-y-6">
                        <h2 className="text-lg font-bold uppercase tracking-widest">Fragrance Studio</h2>
                        <div className="flex justify-center space-x-6">
                            <Instagram size={20} className="text-stone-400 hover:text-black cursor-pointer" />
                            <Send size={20} className="text-stone-400 hover:text-black cursor-pointer" />
                        </div>
                        <p className="text-[10px] text-stone-400 uppercase tracking-widest">© 2024 belinskayaoksana</p>
                    </div>
                </footer>
            );

            return (
                <div className="min-h-screen bg-white">
                    <Header />
                    {currentPage === 'home' ? <HomePage /> : <Catalog />}
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
